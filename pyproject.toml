[project]
name = "tgdata"
version = "0.1.0"
description = "Unified temporal-graph datasets backed by the Hugging Face Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "huggingface_hub>=0.24",
    "torch>=2.0",
]

[project.optional-dependencies]
pyg = ["torch_geometric>=2.4"]
tsl = ["torch-spatiotemporal>=0.9"]
tgb = ["py-tgb>=0.9"]
plot = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgdata"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
