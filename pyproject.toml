[project]
name = "tgdata"
version = "0.4.0"
description = "Unified temporal-graph datasets backed by the Hugging Face Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "huggingface_hub>=0.24",
    "torch>=2.0",
]

[project.optional-dependencies]
pyg = ["torch_geometric>=2.4"]
tsl = ["torch-spatiotemporal>=0.9"]
plot = ["matplotlib>=3.7"]
convert = ["h5py>=3.8"]
cpu = ["torch>=2.0"]
cu128 = ["torch>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.7", "h5py>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgdata"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Torch build for `uv sync`: `--extra cpu` or `--extra cu128` (CUDA 12.8 drivers); with
# neither, torch comes from PyPI. Installers other than uv sync ignore these sources.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
